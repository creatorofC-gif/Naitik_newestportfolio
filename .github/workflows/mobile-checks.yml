name: Mobile & compatibility checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  mobile:
    # Pinned: ubuntu-latest is 26.04, which Playwright 1.56 can't install browsers on yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (resume parser, contact-form guard)
        run: npm run test:unit
      - name: Install browsers (Chromium + WebKit = iOS Safari engine)
        run: npx playwright install --with-deps chromium webkit
      - name: Run checks on iPhone 14, Pixel 7, iPad
        run: npx playwright test
      - name: Upload report (screens, traces) if anything failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
